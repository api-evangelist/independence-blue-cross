summary: >-
  The entity graph is HL7 FHIR R4's, not a proprietary one, so relationships are expressed as FHIR
  Reference elements (Reference(ResourceType)) rather than opaque id fields. Independence Blue Cross
  publishes three disjoint-but-overlapping projections of that graph on three separate base paths. The
  IBX OpenAPIs declare no components.schemas, so the relationships below are derived from the FHIR R4
  resource definitions the server conforms to, cross-checked against the six curated subset schemas in
  json-schema/ that this repo already carries.
id_conventions:
  style: fhir-logical-id
  pattern: '{base}/{ResourceType}/{id}'
  note: >-
    Resource ids are server-assigned FHIR logical ids with no type prefix and no documented format.
    An id is only meaningful relative to the base path it came from — a Practitioner id from
    provider/v1/fhir is not guaranteed resolvable at patient/v1/fhir. Cross-resource links appear as
    Reference.reference strings of the form "Practitioner/123".
surfaces:
  - name: Patient Access
    base: https://eapics.ibx.com/patient/v1/fhir
    auth: SMART on FHIR OAuth 2.0 (member consent)
    entity_count: 19
  - name: Provider Directory
    base: https://eapics.ibx.com/provider/v1/fhir
    auth: none (public)
    entity_count: 8
  - name: Drug Formulary
    base: https://eapics.ibx.com/formulary/v1/fhir
    auth: none (public)
    entity_count: 2
