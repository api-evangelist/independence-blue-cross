traversal_notes:
  - >-
    Use _include / _revinclude to hydrate references in one round trip rather than N+1 reads — for
    example GET /provider/v1/fhir/PractitionerRole?_include=PractitionerRole:practitioner&_include=PractitionerRole:organization.
  - >-
    Cross-surface joins are the sharp edge: a Practitioner referenced from a Patient Access
    ExplanationOfBenefit lives on patient/v1/fhir, and the richly-populated directory record for the
    same clinician lives on provider/v1/fhir. There is no published identifier crosswalk between the
    two bases; match on Practitioner.identifier (NPI) rather than on logical id.
  - >-
    The formulary surface is disconnected from the other two — MedicationKnowledge on formulary/v1/fhir
    shares no logical id space with Medication on patient/v1/fhir. Join on drug code (RxNorm/NDC).
