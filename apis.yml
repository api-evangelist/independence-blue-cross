apis:
  - aid: independence-blue-cross:patient-access-api
    name: Independence Blue Cross Patient Access FHIR API
    description: >-
      HL7 FHIR R4 (4.0.1) Patient Access API published to satisfy the CMS Interoperability and Patient Access final rule
      (CMS-9115-F). Enables Independence Medicare Advantage and Keystone HMO CHIP members (or their personal
      representatives) to consent and share clinical, claims, encounter, coverage, medication, immunization, and
      demographic data with registered third-party applications. Conforms to the CARIN for Blue Button (CARIN BB),
      Common Payer Consumer Data Set (CPCDS), US Core 3.1.1, and Da Vinci PDex profiles. Secured by SMART App Launch
      1.0.0 over OAuth 2.0 / OpenID Connect; production access requires developer registration and CMS-aligned
      attestation.
    humanURL: https://devportal.ibx.com/documentation/
    baseURL: https://eapics.ibx.com/patient/v1/fhir
