aid: independence-blue-cross
name: Independence Blue Cross
description: >-
  Independence Blue Cross (IBX) is the Blue Cross Blue Shield Association licensee for southeastern Pennsylvania (Bucks,
  Chester, Delaware, Montgomery, and Philadelphia counties) and a subsidiary of Independence Health Group, Inc., the
  parent holding company that consolidated IBX, AmeriHealth (commercial, including AmeriHealth New Jersey and the
  AmeriHealth Administrators TPA business), and the AmeriHealth Caritas family of Medicaid managed care plans in 2013.
  The company has called Philadelphia home for more than 85 years, serves nearly three million members directly, and —
  through Independence Health Group — supports roughly nine million covered lives across commercial, Medicare Advantage,
  Medicaid, CHIP, dental, vision, and behavioral health lines of business. Independence Health Group reported
  consolidated revenue of $36.3 billion for 2025. To satisfy the CMS Interoperability and Patient Access final rule
  (CMS-9115-F), IBX publishes three HL7 FHIR R4 (4.0.1) APIs from its `eapics.ibx.com` gateway and developer portal at
  `devportal.ibx.com`: a SMART-on-FHIR / OAuth 2.0 secured Patient Access API for Medicare Advantage and Keystone HMO
  CHIP members, a public Da Vinci PDex Plan-Net Provider Directory API, and a public Da Vinci US Drug Formulary (USDF)
  API. The provider also publishes monthly Transparency in Coverage machine-readable files (in-network rates, allowed
  amounts, prescription drugs) for three carrier brands — Keystone Health Plan East, QCC Insurance Company, and
  Independence Assurance Co, Inc.
