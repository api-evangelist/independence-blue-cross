lifecycle_summary: >-
  A compliance-driven API surface with a stable, regulator-anchored contract and essentially no
  published operational lifecycle. The APIs exist because CMS-9115-F requires them, the FHIR R4 and
  Da Vinci/CARIN implementation guides pin the contract externally, and Independence commits to nothing
  about change management, availability or notice. For an integrator this means the shape of the data
  is very predictable (it is HL7's, not IBX's) while the operation of the endpoint is not.
