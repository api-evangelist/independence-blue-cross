search_note: >-
  NO MCP server exists. Searched the web for an Independence Blue Cross / IBX Model Context Protocol
  server, checked the developer portal and developer-resources page, and probed every IBX host for an
  MCP or agent surface — /.well-known/ai-plugin.json 404 on eapics.ibx.com, devportal.ibx.com and
  www.ibx.com; /.well-known/agent-card.json and /.well-known/agent.json 404 on all three (403 on
  member.ibx.com, which rejects all anonymous requests). Independence Blue Cross has no public GitHub
  organization and ships no npm/PyPI package. The tools below are a DERIVED CANDIDATE surface computed
  from the provider's own OpenAPI operations — a proposal for what an MCP server over these FHIR APIs
  would expose, not something anyone ships today.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    mode is none because Independence Blue Cross publishes neither a remote MCP endpoint nor a local
    stdio package. No endpoint URL is guessed here. If IBX later ships a server, the Patient Access
    tools would carry SMART on FHIR OAuth 2.0 (member-consented, patient-context) while the Provider
    Directory and Formulary tools would need no auth at all — a split that makes the two public APIs
    by far the easier agent surface to stand up.
