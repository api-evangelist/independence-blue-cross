note: >-
  Every proposed tool is read-only, because every one of the 60 published IBX operations is a GET. An
  MCP server over this surface could not mutate member data even in principle. The Patient Access tools
  carry PHI and must inherit the member's SMART consent — they are not safe to expose to an agent
  without a per-member authorization flow and are marked accordingly.
