format: fhir-operationoutcome
format_note: >-
  NOT RFC 9457. Independence Blue Cross runs HL7 FHIR R4 servers, and the FHIR specification defines its
  own error envelope: a non-2xx response carries an OperationOutcome resource in application/fhir+json
  with an issue[] array of {severity, code, details, diagnostics, expression}. There is no
  application/problem+json media type, no `type` URI and no error-code registry anywhere on the IBX
  surface. Agents must parse OperationOutcome.issue[].code (an HL7 IssueType value) rather than a
  provider-specific code.
envelope:
  media_type: application/fhir+json
  resource: OperationOutcome
  fields:
    - issue[].severity   # fatal | error | warning | information
    - issue[].code       # HL7 IssueType, e.g. invalid, security, forbidden, not-found, processing
    - issue[].details    # CodeableConcept, human text
    - issue[].diagnostics
    - issue[].expression # FHIRPath to the offending element
  code_registry: http://hl7.org/fhir/R4/valueset-issue-type.html
  note: >-
    The provider does not publish the OperationOutcome shape itself; it is the FHIR R4 normative
    envelope every conformant FHIR server returns. The field list above is the specification's, not an
    invention, and the IBX OpenAPIs declare no response schema for any 4xx.
